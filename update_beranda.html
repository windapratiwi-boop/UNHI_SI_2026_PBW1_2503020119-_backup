<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

  <!-- NAVBAR -->
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#">

        </li>
        <li class="nav-item d-none d-md-block">
          <a href="#" class="nav-link">Home</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand">
      <a href="#" class="brand-link">
        <!-- ✅ SUDAH DIGANTI -->
        <span class="brand-text fw-light">Winda Dashboard</span>
      </a>
    </div>

    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column">

          <li class="nav-item menu-open">
            <a href="#" class="nav-link active">
              <i class="nav-icon bi bi-speedometer"></i>
              <p>Dashboard</p>
            </a>

            <ul class="nav nav-treeview">
              <li class="nav-item">
                <a href="#" class="nav-link active">
                  <p>Update Beranda</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <p>Update Biografi</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">

                </a>
              </li>

                <a href="#" class="nav-link">
                  <p>Kontak Saya</p>
                </a>
              </li>
            </ul>

          </li>

        </ul>
      </nav>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="app-main">

    <!-- HEADER -->
    <div class="app-content-header">
      <div class="container-fluid">
        <div class="row">
          <div class="col-sm-6">
            <h3 class="mb-0">Formulir Beranda</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="app-content">
      <div class="container-fluid">

        <div class="row">
          <div class="col-md-6">

            <div class="card card-primary card-outline">
              <div class="card-header">
                <h3 class="card-title">Update Beranda</h3>
              </div>

              <form>
                <div class="card-body">

                  <div class="mb-3">
                    <label class="form-label">Upload Hero Image</label>
                    <input type="file" class="form-control">
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Sambutan Awal</label>
                    <input type="text" class="form-control" placeholder="Ketik sambutan...">
                  </div>

                </div>

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">
                    Simpan
                  </button>
                </div>

              </form>

            </div>

          </div>
        </div>

      </div>
    </div>
