<!DOCTYPE html>
<html>
<head>
<title>Manipulasi jQuery</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1 id="judul">Judul Lama</h1>
<button id="btn">Ubah Judul</button>

<script>
$(function() {
$("#btn").click(function() {
$("#judul").text("Judul Baru dengan jQuery");
$("#judul").css("color", "blue");
});
});
</script>

</body>
</html>
