<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Winda Dashboard | Kontak</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- OverlayScrollbars -->
  <link href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" rel="stylesheet">

  <!-- AdminLTE (FIX CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" rel="stylesheet">

</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

  <!-- NAVBAR -->
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#">
            <i class="bi bi-list"></i>
          </a>
        </li>
        <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand">
      <a href="#" class="brand-link">
        <span class="brand-text fw-light">Winda Dashboard</span>
      </a>
    </div>

    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav flex-column p-2">
          <li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Update Beranda</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Update Biografi</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Riwayat Pendidikan</a></li>
          <li class="nav-item"><a href="#" class="nav-link active">Kontak Saya</a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="app-main">
    <div class="container-fluid mt-3">

      <h3>Formulir Kontak Winda</h3>

      <div class="card mt-3">
        <div class="card-header">
          <b>Update Kontak Saya</b>
        </div>

        <div class="card-body">

          <div class="mb-3">
            <label class="form-label">Nomor HP / WhatsApp</label>
            <input type="text" class="form-control" placeholder="08xxxxxxxxxx">
          </div>

          <div class="mb-3">
            <label class="form-label">Alamat</label>
            <input type="text" class="form-control" placeholder="Masukkan alamat">
          </div>

          <div class="mb-3">
            <label class="form-label">Instagram</label>
            <input type="text" class="form-control" placeholder="https://instagram.com/username">
          </div>

          <div class="mb-3">
            <label class="form-label">Facebook</label>
            <input type="text" class="form-control" placeholder="https://facebook.com/username">
          </div>

          <div class="mb-3">
            <label class="form-label">Tiktok</label>
            <input type="text" class="form-control" placeholder="https://tiktok.com/@username">
          </div>

        </div>

        <div class="card-footer">
          <button class="btn btn-primary">Simpan Kontak</button>
        </div>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="app-footer text-center">
    © 2026 Winda Dashboard
  </footer>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

</body>
</html>
